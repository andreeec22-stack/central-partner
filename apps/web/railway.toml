# Railway service "web" (nginx: the SPA + same-origin proxy to the API). In the
# service settings leave Root Directory empty (the Dockerfile builds from the
# repo root) and set the config-as-code path to /apps/web/railway.toml.
# Variables: DEPLOYMENT_RAILWAY.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"
watchPatterns = ["apps/web/**", "package.json", "package-lock.json"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
