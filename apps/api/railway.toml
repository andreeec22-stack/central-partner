# Railway service "api". In the service settings leave Root Directory empty
# (the Dockerfile builds from the repo root) and set the config-as-code path to
# /apps/api/railway.toml. Variables: DEPLOYMENT_RAILWAY.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
# Web-only or docs-only commits don't redeploy the API.
watchPatterns = ["apps/api/**", "package.json", "package-lock.json"]

[deploy]
# The image's CMD applies pending migrations, then starts on $PORT.
healthcheckPath = "/health"
# Migrations run before the server listens.
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Matches the API's shutdown (sockets, jobs, DB pool) and compose's stop_grace_period.
drainingSeconds = 20
